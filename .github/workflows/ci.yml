name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/pr-ci.yml@main
    with:
      variant: host

  detect-providers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          profile: minimal
      - name: List changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          else
            : > changed-files.txt
          fi
          cat changed-files.txt
      - name: Build provider matrix
        id: matrix
        run: |
          matrix=$(cargo xtask provider-matrix --provider all --changed-files changed-files.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  provider-check:
    needs:
      - ci
      - detect-providers
    runs-on: ubuntu-latest
    if: ${{ fromJson(needs.detect-providers.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-providers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          profile: minimal
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo clippy provider
        run: cargo clippy -p ${{ matrix.package }} --all-targets --all-features -- -D warnings
      - name: cargo test provider
        run: cargo test -p ${{ matrix.package }} --all-features
      - name: cargo build provider
        run: cargo build -p ${{ matrix.package }} --all-features

  fdb-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          profile: minimal
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install FoundationDB client
        run: |
          curl -sSL -o /tmp/fdb-clients.deb \
            https://github.com/apple/foundationdb/releases/download/7.3.27/foundationdb-clients_7.3.27-1_amd64.deb
          sudo dpkg -i /tmp/fdb-clients.deb
      - name: Start FoundationDB (single-node)
        run: |
          docker run -d --name fdb --network host foundationdb/foundationdb:7.3.27
          # Retry configure until the freshly-started server accepts it (handles cold start).
          configured=0
          for i in $(seq 1 30); do
            out="$(docker exec fdb fdbcli --exec "configure new single memory" 2>&1 || true)"
            if echo "$out" | grep -qiE "Database created|already"; then
              configured=1
              break
            fi
            sleep 2
          done
          if [ "$configured" -ne 1 ]; then
            echo "FoundationDB did not become configurable in time"; docker logs fdb || true; exit 1
          fi
          docker exec fdb fdbcli --exec "status minimal"
          docker exec fdb cat /var/fdb/fdb.cluster > "$RUNNER_TEMP/fdb.cluster"
      - name: Run foundationdb-real tests
        env:
          FDB_CLUSTER_FILE: ${{ runner.temp }}/fdb.cluster
        run: cargo test -p provider-foundationdb --features foundationdb-real
